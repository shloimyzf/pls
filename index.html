<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
    font-family: sans-serif;
  }
  .bike-box {
    text-align: center;
    animation: flash 1s infinite alternate;
  }
  h1 {
    font-size: 4rem;
    color: #ff0000;
    text-transform: uppercase;
    margin: 0;
    line-height: 1;
  }
  @keyframes flash {
    from { opacity: 1; transform: scale(1); }
    to { opacity: 0.3; transform: scale(1.1); }
  }
</style>
</head>
<body>

<div class="bike-box">
  <h1>WHERE'S<br>MY BIKE?</h1>
</div>

</body>
</html>
